[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-risk-agent"
version = "0.1.0"
description = "疫情風險評估 AI Agent：新聞查證、快速風險評估與互動式報告產生器（臺灣公共衛生用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / internal use" }
dependencies = [
  "pydantic>=2.6",
  "jinja2>=3.1",
  "anthropic>=2.0",
  "httpx>=0.27",
  "pypdf>=4.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
serve = []          # `epi-risk serve` uses only the Python standard library
dev = ["pytest>=8"]

[project.scripts]
epi-risk = "epi_risk_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epi_risk_agent = ["templates/*.html", "templates/*.css", "templates/*.js", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
